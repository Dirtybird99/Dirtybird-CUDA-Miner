name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install CUDA toolkit (nvcc only; hosted runners have no GPU)
        id: cuda
        uses: Jimver/cuda-toolkit@8022558310ea543e35132143092835585f60e628 # v0.2.21
        with:
          cuda: '12.5.1'
          method: network
          sub-packages: '["nvcc", "cudart-dev"]'

      - name: Install build and shell dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev shellcheck

      - name: Check shell scripts
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
            shellcheck --severity=error "$file"
          done < <(git ls-files -z '*.sh')

      - name: Build (compile-only; GPU parity/bench gate is skipped without a GPU)
        run: SKIP_SELFTEST=1 CUDA_ARCH=sm_89 DIRTYBIRD_VERSION=dev bash build.sh

      - name: Smoke test (--help; no GPU needed)
        run: LD_LIBRARY_PATH="${CUDA_PATH}/lib64:${LD_LIBRARY_PATH:-}" ./bin/openastronv_v3 --help

      - name: Smoke test (--version; no GPU needed)
        run: test "$(LD_LIBRARY_PATH="${CUDA_PATH}/lib64:${LD_LIBRARY_PATH:-}" ./bin/openastronv_v3 --version)" = "derocuda dev"

      - name: Verify DERO vectors (CPU-only)
        run: LD_LIBRARY_PATH="${CUDA_PATH}/lib64:${LD_LIBRARY_PATH:-}" ./bin/openastronv_v3 --verify-dero-vectors

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openastronv_v3-linux-x64
          path: bin/openastronv_v3
          retention-days: 7

# NOTE: AstroBWTv3 correctness (GPU-vs-CPU-oracle parity) and the hashrate gate require a real
# NVIDIA GPU, which GitHub-hosted runners do not have. Run the full gate locally / on a self-hosted
# GPU runner:  bash build.sh   (runs --verify-recovered-gpu-parity + a >=8 KH/s bench before deploy).
