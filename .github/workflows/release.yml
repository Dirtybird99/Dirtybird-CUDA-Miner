name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in build-only artifacts (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve and verify version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VER="$GITHUB_REF_NAME"
            REF=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VER")
            [[ "$(jq -r '.object.type' <<<"$REF")" == "tag" ]] || { echo "Release tags must be annotated" >&2; exit 1; }
            TAG=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r '.object.sha' <<<"$REF")")
            [[ "$(jq -r '.object.sha' <<<"$TAG")" == "$GITHUB_SHA" ]] || { echo "Tag does not point to the workflow commit" >&2; exit 1; }
            [[ "$(jq -r '.verification.verified' <<<"$TAG")" == "true" ]] || { echo "Release tag signature is not verified" >&2; exit 1; }
          else
            VER="$INPUT_VERSION"
          fi
          [[ "$VER" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must match vX.Y.Z" >&2; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: metadata
    runs-on: ubuntu-22.04
    # HiveOS rigs run Ubuntu 20.04 (glibc 2.31). Built on the 22.04 runner, the
    # binary and its bundled libssl/libcrypto/libstdc++ demanded GLIBC_2.32+ and
    # a rig refused to load them. Building inside a 20.04 container puts the
    # floor at the oldest glibc the rigs ship; the desktop and WSL packages come
    # off the same nvcc link, so they inherit the wider compatibility for free.
    container:
      image: ubuntu:20.04
    # Inside a container the runner cannot assume bash exists, so `run` steps
    # default to `sh -e` -- dash on Ubuntu, which has no `set -o pipefail`, no
    # `[[ ]]`, and no process substitution. The packaging step needs all three.
    defaults:
      run:
        shell: bash
    env:
      VER: ${{ needs.metadata.outputs.version }}
      # focal's apt pulls tzdata transitively; without this a dependency prompt
      # blocks until the job times out instead of failing fast.
      DEBIAN_FRONTEND: noninteractive
    timeout-minutes: 90
    steps:
      # actions/checkout executes inside the job container, and the bare
      # ubuntu:20.04 image ships no git -- so the checkout cannot run at all
      # until it exists. The rest of the toolchain is installed after the
      # source is present.
      - name: Install git (container ships none)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install CUDA 12.5 toolkit and build dependencies
        run: |
          set -euo pipefail
          # jq: the packaged mmp-stats.sh needs it, and test-h-stats.sh only
          # validates the emitted JSON when it is present.
          apt-get install -y --no-install-recommends \
            build-essential curl libssl-dev zip jq
          # Focal's stock GCC 9 is the host compiler. It only became viable once
          # the startup banner stopped calling __builtin_cpu_supports("sha"),
          # which GCC did not accept until 11 -- reading the CPUID bit directly
          # avoids pulling a whole extra toolchain in here for one banner line.
          # Same repo layout the arm64 job uses, pointed at focal/x86_64.
          curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2004/x86_64/cuda-keyring_1.1-1_all.deb
          dpkg -i cuda-keyring_1.1-1_all.deb
          apt-get update
          apt-get install -y --no-install-recommends cuda-nvcc-12-5 cuda-cudart-dev-12-5
          # build.sh resolves the toolkit with `command -v nvcc`, falling back to
          # $CUDA_HOME. apt puts nvcc under /usr/local and sets neither.
          echo "/usr/local/cuda-12.5/bin" >> "$GITHUB_PATH"
          echo "CUDA_HOME=/usr/local/cuda-12.5" >> "$GITHUB_ENV"

      - name: Build Ampere, Ada, and Hopper fatbin
        run: SKIP_SELFTEST=1 CUDA_ARCH=sm_86,sm_89,sm_90 DIRTYBIRD_VERSION="$VER" bash build.sh

      - name: Smoke test
        run: |
          set -euo pipefail
          test "$(./bin/openastronv_v3 --version)" = "derocuda $VER"
          ./bin/openastronv_v3 --help >/dev/null
          ./bin/openastronv_v3 --verify-dero-vectors

      - name: Package Linux, WSL, and HiveOS/MMPOS
        run: |
          set -euo pipefail
          mkdir -p dist

          # Everything the binary needs that the host will not already have,
          # discovered from ldd rather than named: the OpenSSL soname tracks the
          # build distribution (libssl.so.1.1 on focal, libssl.so.3 on jammy), so
          # a hardcoded list silently stops matching when the floor moves.
          should_bundle() {
            case "$1" in
              linux-vdso.so.1|linux-gate.so.1|ld-linux*.so.*|libc.so.*|libm.so.*|libpthread.so.*|librt.so.*|libdl.so.*|libutil.so.*|libresolv.so.*|libnsl.so.*|libanl.so.*) return 1 ;;
              *) return 0 ;;
            esac
          }

          LIN="Dirtybird-CUDA-Miner-linux-amd64-${VER}"
          mkdir -p "dist/${LIN}/lib"
          cp bin/openastronv_v3 README.md LICENSE THIRD-PARTY-LICENSES.md "dist/${LIN}/"
          while IFS= read -r line; do
            if [[ "$line" =~ ^[[:space:]]*([^[:space:]]+)[[:space:]]+\=\>[[:space:]]+([^[:space:]]+)[[:space:]]+\(0x[0-9a-fA-F]+\)$ ]]; then
              # basename before the filter: an ldd entry spelled
              # "lib64/ld-linux-x86-64.so.2" slips past the denylist otherwise and
              # gets installed to lib//lib64/..., which fails the copy.
              SO="$(basename "${BASH_REMATCH[1]}")"
              should_bundle "$SO" || continue
              install -m 0644 "$(readlink -f "${BASH_REMATCH[2]}")" "dist/${LIN}/lib/$SO"
            fi
          done < <(ldd bin/openastronv_v3)
          # The soname is free to move; the library still has to be there.
          for WANT in libssl libcrypto libstdc++ libgcc_s; do
            ls "dist/${LIN}/lib" | grep -q "^${WANT}\." || { echo "not bundled: $WANT" >&2; exit 1; }
          done

          WSL="Dirtybird-CUDA-Miner-windows-wsl-${VER}"
          mkdir -p "dist/${WSL}"
          cp bin/openastronv_v3 README.md LICENSE THIRD-PARTY-LICENSES.md run-gpu-miner.bat "dist/${WSL}/"
          cp -a "dist/${LIN}/lib" "dist/${WSL}/"

          HIVE="dirtybird-cuda"
          mkdir -p "dist/${HIVE}"
          cp bin/openastronv_v3 README.md LICENSE THIRD-PARTY-LICENSES.md "dist/${HIVE}/"
          cp hiveos/h-manifest.conf hiveos/h-config.sh hiveos/h-run.sh hiveos/h-stats.sh hiveos/mmp-stats.sh "dist/${HIVE}/"
          sed -i "s/^CUSTOM_VERSION=.*/CUSTOM_VERSION=${VER#v}/" "dist/${HIVE}/h-manifest.conf"
          chmod +x "dist/${HIVE}"/*.sh
          cp -a "dist/${LIN}/lib" "dist/${HIVE}/"

          LD_LIBRARY_PATH="$PWD/dist/${LIN}/lib" "dist/${LIN}/openastronv_v3" --verify-dero-vectors
          test "$(LD_LIBRARY_PATH="$PWD/dist/${LIN}/lib" "dist/${LIN}/openastronv_v3" --version)" = "derocuda $VER"
          grep -qx "CUSTOM_VERSION=${VER#v}" "dist/${HIVE}/h-manifest.conf"

          tar -C dist -czf "dist/${LIN}.tar.gz" "$LIN"
          (cd dist && zip -qr "${WSL}.zip" "$WSL")
          tar -C dist -czf "dist/dirtybird-cuda-miner-${VER}.hiveos_mmpos.amd64.tar.gz" "$HIVE"
          rm -rf "dist/${LIN}" "dist/${WSL}" "dist/${HIVE}"

      # A rig rejects the miner at load time, and the bundled libs plus the
      # $ORIGIN/lib rpath only exist once packaging has run -- so the tarball
      # itself has to be executed, not just the build-tree binary. Still inside
      # the 20.04 container, and deliberately without LD_LIBRARY_PATH, so this is
      # a real glibc 2.31 load resolved through the rpath alone.
      # --verify-dero-vectors is CPU-only (ci.yml runs it on a GPU-less runner);
      # the GPU parity and hashrate gates stay skipped via SKIP_SELFTEST=1.
      - name: Verify the packaged HiveOS tarball loads on glibc 2.31
        run: |
          set -euo pipefail
          rm -rf /tmp/hive-verify
          mkdir -p /tmp/hive-verify
          tar -xzf "dist/dirtybird-cuda-miner-${VER}.hiveos_mmpos.amd64.tar.gz" -C /tmp/hive-verify
          BIN="$(find /tmp/hive-verify -type f -name openastronv_v3 -print -quit)"
          test -n "$BIN"
          test "$("$BIN" --version)" = "derocuda $VER"
          "$BIN" --verify-dero-vectors
          # Exercise the SHIPPED parser, not the repo copy -- packaging could drop
          # or mangle it and nothing else would notice. The test injects its own
          # manifest, so this covers h-stats.sh itself; the packaged manifest's
          # CUSTOM_VERSION is asserted separately in the packaging step above.
          # The test is deliberately not packaged: rigs do not need it.
          bash hiveos/test-h-stats.sh /tmp/hive-verify/dirtybird-cuda

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-amd64
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  build-arm64:
    needs: metadata
    runs-on: ubuntu-22.04-arm
    env:
      VER: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install CUDA 12.5 SBSA toolkit and dependencies
        run: |
          set -euo pipefail
          curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/sbsa/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y cuda-nvcc-12-5 cuda-cudart-dev-12-5 libssl-dev
          echo "/usr/local/cuda-12.5/bin" >> "$GITHUB_PATH"

      - name: Build Jetson and GH200 fatbin
        run: SKIP_SELFTEST=1 CUDA_ARCH=sm_87,sm_90 DIRTYBIRD_VERSION="$VER" bash build.sh

      - name: Smoke test
        run: |
          set -euo pipefail
          test "$(./bin/openastronv_v3 --version)" = "derocuda $VER"
          ./bin/openastronv_v3 --help >/dev/null
          ./bin/openastronv_v3 --verify-dero-vectors

      - name: Package arm64
        run: |
          set -euo pipefail
          ARM="Dirtybird-CUDA-Miner-linux-arm64-${VER}"
          mkdir -p "dist/${ARM}/lib"
          cp bin/openastronv_v3 README.md LICENSE THIRD-PARTY-LICENSES.md "dist/${ARM}/"
          for LIB in libssl.so.3 libcrypto.so.3 libstdc++.so.6 libgcc_s.so.1; do
            PATHNAME=$(ldd bin/openastronv_v3 | awk -v lib="$LIB" '$1 == lib { print $3; exit }')
            test -n "$PATHNAME" && test -f "$PATHNAME"
            cp -L "$PATHNAME" "dist/${ARM}/lib/"
          done
          LD_LIBRARY_PATH="$PWD/dist/${ARM}/lib" "dist/${ARM}/openastronv_v3" --verify-dero-vectors
          tar -C dist -czf "dist/${ARM}.tar.gz" "$ARM"
          rm -rf "dist/${ARM}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-arm64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-win64:
    needs: metadata
    runs-on: windows-2022
    env:
      VER: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@8022558310ea543e35132143092835585f60e628 # v0.2.21
        with:
          cuda: '12.5.1'
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: Install static OpenSSL
        shell: pwsh
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static'

      - name: Build native Windows fatbin
        shell: pwsh
        run: |
          cmake -S . -B build-release -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_CUDA_ARCHITECTURES="86;89;90" `
            -DDIRTYBIRD_VERSION="$env:VER"
          cmake --build build-release --config Release --parallel 2

      - name: Smoke test and inspect dependencies
        shell: pwsh
        run: |
          $exe = Resolve-Path build-release/Release/openastronv_v3.exe
          if ((& $exe --version) -ne "derocuda $env:VER") { throw "Incorrect embedded version" }
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "--help failed" }
          & $exe --verify-dero-vectors
          if ($LASTEXITCODE -ne 0) { throw "CPU vector verification failed" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents $exe | Out-String
          $deps
          if ($deps -match 'libssl|libcrypto|VCRUNTIME|MSVCP|cudart64') { throw "Unexpected dynamic runtime dependency" }

      - name: Package native Windows
        shell: pwsh
        run: |
          $name = "Dirtybird-CUDA-Miner-win64-$env:VER"
          $dir = Join-Path dist $name
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item build-release/Release/openastronv_v3.exe,README.md,LICENSE,THIRD-PARTY-LICENSES.md $dir
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force -LiteralPath $dir

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-win64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [metadata, build-amd64, build-arm64, build-win64]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VER: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Verify release inventory and checksums
        run: |
          set -euo pipefail
          mkdir dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp '{}' dist/ \;
          EXPECTED=(
            "Dirtybird-CUDA-Miner-linux-amd64-${VER}.tar.gz"
            "Dirtybird-CUDA-Miner-linux-arm64-${VER}.tar.gz"
            "Dirtybird-CUDA-Miner-win64-${VER}.zip"
            "Dirtybird-CUDA-Miner-windows-wsl-${VER}.zip"
            "dirtybird-cuda-miner-${VER}.hiveos_mmpos.amd64.tar.gz"
          )
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq "${#EXPECTED[@]}"
          for FILE in "${EXPECTED[@]}"; do test -f "dist/$FILE"; done
          (cd dist && sha256sum "${EXPECTED[@]}" > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Create draft release
        run: |
          set -euo pipefail
          if gh release view "$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VER already exists" >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          CUDA AstroBWTv3 miner for DERO with a 0% developer fee.

          - Recovered-engine comparator improvement: +1.51% in paired RTX 4070 testing.
          - Safe 4096 default batch below the 8 GB resource cliff.
          - Native Windows x64 plus Linux amd64, Linux arm64, WSL2, and HiveOS/MMPOS packages.
          - Linux/Windows x64 fatbins: sm_86, sm_89, sm_90. Linux arm64: sm_87, sm_90.

          GitHub-hosted builders have no NVIDIA GPU. CPU vectors and package smoke tests run in CI;
          the exact native Windows draft asset is GPU parity-tested on an RTX 4070 before publication.
          Run `openastronv_v3 --verify-recovered-gpu-parity` on your own GPU before relying on a build.

          macOS and Android are not provided because current NVIDIA CUDA does not support those targets.
          EOF
          gh release create "$VER" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$VER" --generate-notes --notes-file release-notes.md
